version: v1
baselines:
  B_LOCAL:
    name: Outsourced local laundry
    water_l_per_kg: 9.5
    energy_kwh_per_kg: 1.05
    process_kgco2e_per_kg: 0.62
    delivery_kgco2e_per_kg: 0.035
    mixed_waste_share: 1.0
    note: No systematic repair; textile waste assumed mixed waste. Values illustrative.
    default: true
  B_HOME:
    name: Home washing
    water_l_per_kg: 20.0
    energy_kwh_per_kg: 1.18
    process_kgco2e_per_kg: 0.78
    delivery_kgco2e_per_kg: 0.0
    mixed_waste_share: 1.0
    note: 53% load-utilization concept; no centralized delivery; no systematic repair. Values illustrative.
    default: false
  B_INHOUSE:
    name: In-house customer laundry
    water_l_per_kg: 12.5
    energy_kwh_per_kg: 1.12
    process_kgco2e_per_kg: 0.68
    delivery_kgco2e_per_kg: 0.015
    mixed_waste_share: 1.0
    note: Customer-operated laundry scenario; no systematic repair. Values illustrative.
    default: false
sensitivity:
  low:
    baseline_factor: 0.85
    replacements_per_repair: 0.25
  base:
    baseline_factor: 1.0
    replacements_per_repair: 1.0
  high:
    baseline_factor: 1.15
    replacements_per_repair: 1.0
dto_inputs:
  # Service vs do-it-yourself inputs (design 8a): default, low, high; illustrative Nordic values.
  # The account manager may override any of them per account (data/kam_inputs/).
  local_laundry_eur_per_kg: {label: Local laundry price, unit: EUR/kg, default: 2.5, low: 1.8, high: 3.5, assumption_id: T4}
  energy_eur_per_kwh: {label: Energy price, unit: EUR/kWh, default: 0.15, low: 0.10, high: 0.25, assumption_id: T5}
  water_eur_per_m3: {label: Water price, unit: EUR/m3, default: 4.0, low: 3.0, high: 6.0, assumption_id: T6}
  detergent_eur_per_kg: {label: Detergent & chemicals, unit: EUR/kg, default: 0.05, low: 0.03, high: 0.08, assumption_id: T7}
  labour_eur_per_h: {label: Staff cost, unit: EUR/h, default: 30.0, low: 25.0, high: 40.0, assumption_id: T8}
  handling_min_per_kg: {label: Washing & handling time (in-house/home), unit: min/kg, default: 3.0, low: 2.0, high: 5.0, assumption_id: T9}
  admin_h_per_site_month: {label: Garment admin time without service, unit: h/site/month, default: 4.0, low: 2.0, high: 8.0, assumption_id: T10}
  garment_life_years_no_repair: {label: Garment life without repair service, unit: years, default: 2.0, low: 1.5, high: 3.0, assumption_id: T11}
register:
- id: A001
  assumption: Default comparison baseline
  value_or_rule: Outsourced local laundry
  confidence: Medium
  treatment: Editable
- id: A002
  assumption: Repair handprint
  value_or_rule: 1 completed repair postpones 1 replacement event
  confidence: Low-Medium
  treatment: Sensitivity-test
- id: A003
  assumption: Waste attribution
  value_or_rule: Laundry waste allocated by customer share of washed kg
  confidence: Medium
  treatment: Required disclosure
- id: A004
  assumption: Waste baseline
  value_or_rule: 100% mixed-waste treatment in baseline
  confidence: Low-Medium
  treatment: Editable
- id: A005
  assumption: Product footprint
  value_or_rule: Synthetic kgCO2e values by product
  confidence: Low
  treatment: Replace for production
- id: A006
  assumption: Customer hierarchy
  value_or_rule: Synthetic parent customer/site hierarchy
  confidence: High
  treatment: Prototype
- id: A007
  assumption: Industry emphasis
  value_or_rule: Rules use customer industry and stated priority
  confidence: Medium
  treatment: Review
- id: A008
  assumption: Data status
  value_or_rule: Every output retains source/status label
  confidence: High
  treatment: Mandatory
- id: T1
  assumption: Sensitivity range (team)
  value_or_rule: Baseline factors ×0.85/×1.0/×1.15; replacements per repair 0.25/1.0/1.0
  confidence: Medium
  treatment: Editable
- id: T2
  assumption: Wearer de-duplication (team)
  value_or_rule: max(active_wearers) across product rows per site-month
  confidence: Medium
  treatment: Confirm with data owner
- id: T3
  assumption: Mats baseline factors (team)
  value_or_rule: Mats use the same per-kg baseline factors as workwear
  confidence: Low
  treatment: Replace with mat-specific factors for production
- id: T4
  assumption: Local laundry price (DIY input)
  value_or_rule: 2.5 EUR/kg (1.8-3.5); illustrative Nordic values
  confidence: Low
  treatment: Editable by the account manager
- id: T5
  assumption: Energy price (DIY input)
  value_or_rule: 0.15 EUR/kWh (0.10-0.25); illustrative Nordic values
  confidence: Low
  treatment: Editable by the account manager
- id: T6
  assumption: Water price (DIY input)
  value_or_rule: 4 EUR/m3 (3-6); illustrative Nordic values
  confidence: Low
  treatment: Editable by the account manager
- id: T7
  assumption: Detergent & chemicals (DIY input)
  value_or_rule: 0.05 EUR/kg (0.03-0.08); illustrative Nordic values
  confidence: Low
  treatment: Editable by the account manager
- id: T8
  assumption: Staff cost (DIY input)
  value_or_rule: 30 EUR/h (25-40); illustrative Nordic values
  confidence: Low
  treatment: Editable by the account manager
- id: T9
  assumption: Washing & handling time (DIY input)
  value_or_rule: 3 min/kg (2-5), in-house or home washing; illustrative Nordic values
  confidence: Low
  treatment: Editable by the account manager
- id: T10
  assumption: Garment admin time without service (DIY input)
  value_or_rule: 4 h/site/month (2-8); illustrative Nordic values
  confidence: Low
  treatment: Editable by the account manager
- id: T11
  assumption: Garment life without repair service (DIY input)
  value_or_rule: 2 years (1.5-3); illustrative Nordic values
  confidence: Low
  treatment: Editable by the account manager
